<div class="main tb-height--full junkie">
    <mat-toolbar [@transitionFromTop]="{value:'in', params: {animDelay: 200}}"
        (@transitionFromTop.done)='_onToolbarAnimationEnd($event)'
        appWidgetWaterfall [waterfallReferenceTarget]="contentScroller"
        waterfallReferenceLink="dashboard-content" waterfallActiveClass="active"
        class="junkie-top-nav tb-position--fixed tb-width--full tb-z-index--3">

        <mat-toolbar-row class="navbar-row">
            <a class="brand-link tb-a--unset" matRipple routerLink="/">
                <div class="brand" fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="10px">
                    <span class="brand-mono">NS</span>
                    <span class="brand-name" fxHide.xs>Nihal Shah</span>
                </div>
            </a>

            <span class="spacer"></span>

            <div class="nav-actions" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px">
                <a class="nav-link" href="https://github.com/nihalashah" target="_blank" rel="noopener" fxHide.xs>GitHub</a>
                <a class="nav-link" href="https://www.linkedin.com/in/nihal-shahh/" target="_blank" rel="noopener" fxHide.xs>LinkedIn</a>

                <button class="theme-toggle" (click)="_toggleTheme()" [attr.aria-label]="'Switch to ' + (_mTheme === 'light' ? 'dark' : 'light') + ' mode'">
                    <span class="theme-icon" *ngIf="_mTheme === 'light'">☾</span>
                    <span class="theme-icon" *ngIf="_mTheme === 'dark'">☀</span>
                </button>

                <a class="nav-cta unlink" href="mailto:nihalshah.dev&#64;gmail.com">
                    <span>Get in touch</span>
                </a>
            </div>
        </mat-toolbar-row>
    </mat-toolbar>

    <mat-sidenav-container class="tb-height--full">
        <mat-sidenav-content fxLayout="column">
            <div class="tb-height--full" fxLayout="column">
                <div fxFlex cdkScrollable class="tb-height--full tb-overflow--auto" id="dashboard-container"
                    #contentScroller>
                    <router-outlet #outlet></router-outlet>
                </div>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>
